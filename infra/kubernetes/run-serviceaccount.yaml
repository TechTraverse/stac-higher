# K-5 (process-compute spec §6.1, §6.3; plan K5-R14): the ServiceAccount
# every run pod runs as. It has no token (automount off here and on every
# pod the executor builds) and no permissions.
#
# NEVER give it a Pod Identity association or an IRSA
# (eks.amazonaws.com/role-arn) annotation: a run's only cloud identity is the
# run-scoped STS credential in its environment Secret (ADR 0013).
#
# R-8 (#144) renders the same object from the chart's templates with a drift
# test against this file; K-6 (#14) applies this directory to kind as-is.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stac-higher-run
  namespace: stac-higher-runs
automountServiceAccountToken: false
