[project]
name = "stac-higher-titiler"
version = "0.1.0"
description = "Derived titiler-pgstac entrypoint mapping platform /api/assets hrefs to s3:// (GOES spec §7.1, I-68)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
# Only needed for tests/test_readers.py, which is skipped when absent. The
# upstream `psycopg-binary` extra is psycopg[binary,pool]; titiler.pgstac.main
# imports psycopg_pool at module load, so the bare psycopg is not enough.
titiler = ["titiler.pgstac[psycopg-binary]==1.7.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stac_higher_titiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Same explicit set as services/proxy-policy — ruff's defaults moved a lot in
# 0.16 and would otherwise decide the rule surface per installed version.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
