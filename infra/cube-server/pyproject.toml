[project]
name = "stac-higher-cube-server"
version = "0.1.0"
description = "Serves registered virtual Icechunk cubes as XYZ tiles and OGC EDR (virtual cube spec §8, ADR 0022)."
requires-python = ">=3.12"
license = { text = "MIT" }
# Pins from the virtual cube spec §8.1. Move xpublish-tiles / xpublish-edr
# only together with the plugin overrides in edr.py (they reuse xpublish-edr
# 0.11.1's position pipeline) and the README's bump notes.
dependencies = [
    "icechunk==2.2.2",
    "zarr>=3,<4",
    "xarray",
    "xpublish==0.5.2",
    "xpublish-tiles==0.9.2",
    "xpublish-edr==0.11.1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
cube-server = "stac_higher_cube_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stac_higher_cube_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Same explicit set as infra/titiler and services/proxy-policy.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
