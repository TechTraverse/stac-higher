{{- /* app and pipeline (R-6), titiler and cubeServer (R-7): the four workloads with an AWS identity. Only the pipeline calls the Kubernetes API. */ -}}
{{- range $c := list "app" "pipeline" "titiler" "cubeServer" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stac-higher.serviceAccountName" (dict "root" $ "component" $c) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" $ "component" (ternary "cube-server" $c (eq $c "cubeServer"))) | nindent 4 }}
  {{- if eq $.Values.identity.mode "irsa" }}
  annotations:
    eks.amazonaws.com/role-arn: {{ get $.Values.identity.roleArns $c | quote }}
  {{- end }}
automountServiceAccountToken: {{ eq $c "pipeline" }}
{{- end }}
