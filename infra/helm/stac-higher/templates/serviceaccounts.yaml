{{- range $c := list "app" "pipeline" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stac-higher.serviceAccountName" (dict "root" $ "component" $c) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" $ "component" $c) | nindent 4 }}
  {{- if eq $.Values.identity.mode "irsa" }}
  annotations:
    eks.amazonaws.com/role-arn: {{ get $.Values.identity.roleArns $c | quote }}
  {{- end }}
automountServiceAccountToken: {{ eq $c "pipeline" }}
{{- end }}
