{{- if and (eq .Values.database.sslMode "verify-full") .Values.database.caBundle.pem }}
{{- /* Runtime ConfigMap. The db hooks mount their own <fullname>-hook-db-ca copy (rendered with the hooks). */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stac-higher.fullname" . }}-db-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" . "component" "config") | nindent 4 }}
data:
  ca-bundle.pem: |
    {{- .Values.database.caBundle.pem | trim | nindent 4 }}
{{- end }}
