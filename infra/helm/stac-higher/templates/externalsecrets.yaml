{{- if eq .Values.secrets.mode "external-secrets" }}
{{- $a := .Values.secrets.arns }}
---
{{ include "stac-higher.externalSecret" (dict "root" . "name" (include "stac-higher.secretName" (dict "root" . "name" "platform")) "json" false "hook" false "keys" (list
  (dict "key" "SESSION_SECRET" "remoteKey" $a.session_secret)
  (dict "key" "CATALOG_BFF_SHARED_SECRET" "remoteKey" $a.catalog_bff_shared_secret)
  (dict "key" "INTERNAL_API_TOKEN" "remoteKey" $a.internal_api_token)
  (dict "key" "CREDENTIALS_MASTER_KEY" "remoteKey" $a.credentials_master_key))) }}
---
{{ include "stac-higher.externalSecret" (dict "root" . "name" (include "stac-higher.secretName" (dict "root" . "name" "dbOwner")) "remoteKey" $a.db_stac_higher_owner "json" true "hook" false "keys" (list "username" "password")) }}
{{- if .Values.secrets.dockerHubArn }}
---
{{ include "stac-higher.externalSecret" (dict "root" . "name" (include "stac-higher.secretName" (dict "root" . "name" "dockerHub")) "remoteKey" .Values.secrets.dockerHubArn "json" true "hook" false "keys" (list "username" "token")) }}
{{- end }}
{{- end }}
