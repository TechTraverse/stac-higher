{{- if .Values.networkPolicy.enabled }}
# Ingress only: egress stays open (spec 6.5, #68). Default-deny covers every pod in the release namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stac-higher.fullname" . }}-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stac-higher.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stac-higher.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- $appFrom := .Values.networkPolicy.appIngressFrom | default list }}
    {{- $ds := .Values.demoSeed }}
    {{- if and $appFrom $ds.enabled (has "images-seed" $ds.seeds) }}
    {{- /* R-10: images-seed calls the app API from inside the namespace */}}
    {{- $appFrom = append $appFrom (dict "podSelector" (dict "matchLabels" (include "stac-higher.selectorLabels" (dict "root" . "component" "demo-seed") | fromYaml))) }}
    {{- end }}
    - {{- with $appFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: 4321
{{- /* R-7: the catalog plane and cube-server. Public ports admit publicIngressFrom (null -> appIngressFrom; both
null -> any source). The proxy also admits the app (BFF writes); stac-api admits only the proxy. */}}
{{- $np := .Values.networkPolicy -}}
{{- $public := ternary $np.appIngressFrom $np.publicIngressFrom (kindIs "invalid" $np.publicIngressFrom) -}}
{{- $appPeer := dict "podSelector" (dict "matchLabels" (include "stac-higher.selectorLabels" (dict "root" . "component" "app") | fromYaml)) -}}
{{- $proxyPeer := dict "podSelector" (dict "matchLabels" (include "stac-higher.selectorLabels" (dict "root" . "component" "auth-proxy") | fromYaml)) -}}
{{- $proxyFrom := list -}}
{{- if $public -}}
{{- $proxyFrom = concat $public (list $appPeer) -}}
{{- end -}}
{{- range $p := list (list "auth-proxy" 8000 $proxyFrom) (list "stac-api" 8082 (list $proxyPeer)) (list "titiler" 8084 $public) (list "tipg" 8085 $public) (list "cube-server" 8086 $public) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stac-higher.fullname" $ }}-{{ index $p 0 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" $ "component" (index $p 0)) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stac-higher.selectorLabels" (dict "root" $ "component" (index $p 0)) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - {{- with index $p 2 }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ index $p 1 }}
{{- end }}
{{- if .Values.networkPolicy.metricsFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stac-higher.fullname" . }}-pipeline-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" . "component" "pipeline") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "stac-higher.selectorLabels" (dict "root" . "component" "pipeline") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8083
{{- end }}
{{- end }}
