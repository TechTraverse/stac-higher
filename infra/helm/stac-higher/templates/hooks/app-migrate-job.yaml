{{- $full := include "stac-higher.fullname" . -}}
{{- $s := dict "root" . -}}
{{- $owner := include "stac-higher.hookSecretName" (dict "root" . "name" "dbOwner") -}}
{{- $proxy := include "stac-higher.hookSecretName" (dict "root" . "name" "dbProxyPolicy") -}}
{{- $d := .Values.database -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}-app-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" . "component" "db-hook") | nindent 4 }}
  annotations:
    {{- include "stac-higher.hookAnnotations" (dict "weight" -10) | nindent 4 }}
spec:
  backoffLimit: {{ .Values.dbJobs.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.dbJobs.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "stac-higher.labels" (dict "root" . "component" "db-hook") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "stac-higher.podSecurityContext" (dict "uid" 999) | nindent 8 }}
      initContainers:
        - name: app-migrate
          image: {{ include "stac-higher.image" (dict "root" . "key" "app") | quote }}
          command: ["node", "app/dist/server/migrate.mjs"]
          env:
            {{- include "stac-higher.dbJobEnv" (dict "root" . "secret" $owner) | nindent 12 }}
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%v/%s" $d.host $d.port $d.name | quote }}
          resources:
            {{- toYaml .Values.dbJobs.resources | nindent 12 }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            {{- include "stac-higher.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          volumeMounts:
            {{- include "stac-higher.dbJobMounts" $s | nindent 12 }}
      containers:
        - name: app-grants
          image: {{ include "stac-higher.image" (dict "root" . "key" "pipeline") | quote }}
          command: ["python", "/etc/stac-higher/db/run_sql.py", "/etc/stac-higher/db/app-grants.sql"]
          env:
            {{- include "stac-higher.dbJobEnv" (dict "root" . "secret" $owner) | nindent 12 }}
            {{- include "stac-higher.dbSqlEnv" (dict "name" "PROXY" "secret" $proxy "keys" (list "username")) | nindent 12 }}
          resources:
            {{- toYaml .Values.dbJobs.resources | nindent 12 }}
          securityContext:
            {{- include "stac-higher.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          volumeMounts:
            {{- include "stac-higher.dbJobMounts" $s | nindent 12 }}
      volumes:
        {{- include "stac-higher.dbJobVolumes" $s | nindent 8 }}
      {{- include "stac-higher.dbJobScheduling" $s | nindent 6 }}
