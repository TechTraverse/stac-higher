apiVersion: v1
kind: Service
metadata:
  name: {{ include "stac-higher.fullname" . }}-pipeline
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" . "component" "pipeline") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stac-higher.selectorLabels" (dict "root" . "component" "pipeline") | nindent 4 }}
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
