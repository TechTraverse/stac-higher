{{- /* One Ingress per public catalog-plane host (R-7, spec 6.1). The app's is ingress.yaml. */ -}}
{{- if .Values.ingress.enabled }}
{{- $full := include "stac-higher.fullname" . -}}
{{- $ing := .Values.ingress -}}
{{- range $h := list (list "catalog" "catalog" "auth-proxy" 8000) (list "titiler" "titiler" "titiler" 8084) (list "tipg" "tipg" "tipg" 8085) (list "cubeServer" "cube-server" "cube-server" 8086) }}
{{- $key := index $h 0 -}}
{{- $own := get $ing $key | default dict -}}
{{- $host := (urlParse (trimSuffix "/" (get $.Values.publicUrls $key))).hostname -}}
{{- $tls := $own.tlsSecretName | default $ing.tlsSecretName }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-{{ index $h 1 }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stac-higher.labels" (dict "root" $ "component" (index $h 2)) | nindent 4 }}
  {{- $ann := merge (deepCopy ($own.annotations | default dict)) (deepCopy ($ing.annotations | default dict)) }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $tls }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-{{ index $h 2 }}
                port:
                  number: {{ index $h 3 }}
{{- end }}
{{- end }}
