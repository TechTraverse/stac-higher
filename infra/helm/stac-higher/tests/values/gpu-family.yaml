# R-8: a second, GPU family (the template for K-8, #16). Same values as app/src/__tests__/helm/runs-fixtures.ts
# (kueue.test.ts checks they agree).
processRuns:
  profileFamilies:
    gpu-l4: gpu-l4
  families:
    gpu-l4:
      gpuResource: nvidia.com/gpu
      extraTaints: [{ key: nvidia.com/gpu, effect: NoSchedule }]
      quota: { cpu: 16, memoryGi: 64, gpus: 2 }
      nodePool:
        requirements:
          - { key: eks.amazonaws.com/instance-gpu-manufacturer, operator: In, values: [nvidia] }
          - { key: eks.amazonaws.com/instance-gpu-name, operator: In, values: [l4] }
          - { key: kubernetes.io/arch, operator: In, values: [amd64] }
          - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
        headroom: { cpu: 4, memoryGi: 16 }
config:
  hardwareProfiles:
    version: 1
    profiles:
      - id: standard
        label: Standard
        description: General purpose. Metadata extraction, small rasters.
        tier: cpu
        accelerator: null
        cpu: { min: 0.25, max: 4, default: 1 }
        memory_mb: { min: 128, max: 16384, default: 512 }
        gpu_count: null
        max_queue_wait_seconds: 900
        image: null
        backend: {}
      - id: cpu-large
        label: CPU — large
        description: Many cores and memory. Mosaics, reprojection, big rasters.
        tier: cpu-large
        accelerator: null
        cpu: { min: 2, max: 8, default: 4 }
        memory_mb: { min: 4096, max: 32768, default: 8192 }
        gpu_count: null
        max_queue_wait_seconds: 900
        image: null
        backend: {}
      - id: gpu-l4
        label: GPU — NVIDIA L4 (24 GB)
        description: Single L4. Inference, cupy/numba kernels, medium models.
        tier: gpu
        accelerator: { vendor: nvidia, model: l4, memory_gb: 24 }
        cpu: { min: 2, max: 16, default: 4 }
        memory_mb: { min: 4096, max: 65536, default: 16384 }
        gpu_count: { min: 1, max: 1, default: 1 }
        max_queue_wait_seconds: 900
        image: null
        backend: {}
