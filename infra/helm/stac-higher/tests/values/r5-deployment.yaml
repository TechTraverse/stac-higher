# The non-R-5 keys a deployment supplies on top of R-5's helm_values.
publicUrls:
  catalog: https://catalog.example.com
  titiler: https://titiler.example.com
  tipg: https://tipg.example.com
  cubeServer: https://cube.example.com
database:
  caBundle:
    existingConfigMap: rds-ca-bundle
secrets:
  externalSecrets:
    storeRef:
      name: aws-secrets-manager
# Deployment-supplied process-runs inputs (R-8): the cluster repo knows them, Terraform does not emit them.
processRuns:
  network:
    dns: [{ ipBlock: { cidr: 10.100.0.10/32 } }] # the cluster's CoreDNS: .10 of the service CIDR (EKS Auto Mode has no kube-dns Service)
  nodes:
    nodeClass:
      role: stac-higher-example-runs-node # the runs nodes' IAM role (with an EKS access entry)
      subnetSelectorTerms: [{ tags: { kubernetes.io/role/internal-elb: "1" } }]
      securityGroupSelectorTerms: [{ tags: { Name: stac-higher-example-runs-nodes } }]
