# R-8: values equivalent to K-6's kind cluster. The rendered ResourceFlavor and ClusterQueue equal
# infra/kueue/kind/ (kueue.test.ts), and the profile set mirrors infra/hardware-profiles/kind.json (the render test
# reads the file itself; keep this copy in step).
processRuns:
  families:
    cpu-default:
      dedicatedNodes: false
      quota: { cpu: 1, memoryGi: 4, gpus: 0 }
  nodes:
    enabled: false
config:
  hardwareProfiles:
    version: 1
    profiles:
      - id: standard
        label: Standard
        description: "kind CI: one CPU of quota in total, so a second run waits for capacity."
        tier: cpu
        accelerator: null
        cpu: { min: 0.25, max: 1, default: 1 }
        memory_mb: { min: 128, max: 1024, default: 512 }
        gpu_count: null
        max_queue_wait_seconds: 600
        image: null
        backend:
          kubernetes:
            queue: process-runs
            node_selector: {}
            tolerations: []
            runtime_class: null
            extended_resources: {}
