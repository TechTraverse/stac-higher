name: stac-higher

# The pipeline image's build, shared by every service that runs it
# (`pipeline` and the one-shot `pgstac-migrate`). It is an anchor rather than
# two copies because the copies DID drift: `pgstac-migrate` kept the short
# `build: ./services/pipeline` form after the named contexts were added, so
# `COPY --from=hardware` resolved as the Docker Hub image `hardware:latest`
# and `docker compose build pgstac-migrate` failed for everyone — it just
# stayed hidden until the minio pull ahead of it started working again.
x-pipeline-build: &pipeline-build
  context: ./services/pipeline
  # The built-in extractor registry (tests/contract-fixtures/
  # builtin-extractors.json) is COPY --from=fixtures'd into the image — the
  # one copy, reached through a named build context because the pipeline's own
  # context is services/pipeline alone (X-2).
  additional_contexts:
    fixtures: ./tests/contract-fixtures
    # The deployment's hardware-profile set (infra/hardware-profiles/
    # local.json) is COPY --from=hardware'd into the image — same reason as
    # `fixtures`: the repo-root .dockerignore excludes infra/ (K-1).
    hardware: ./infra/hardware-profiles
    # The deployment's image policy (C-1) — same reason as hardware.
    imagepolicy: ./infra/image-policy

services:
  database:
    image: ghcr.io/stac-utils/pgstac:v0.9.11
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgis
      - PGUSER=username
      - PGPASSWORD=password
      - PGDATABASE=postgis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "username", "-d", "postgis"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: migrate a persisted volume's pgstac schema to the pinned version
  # (the pgstac image only installs its schema via initdb on a FRESH volume).
  # Reuses the pipeline image, whose lockfile pins pypgstac in lockstep with
  # the loader; a no-op at matching versions. See ADR 0001 / ISSUES I-54.
  pgstac-migrate:
    build: *pipeline-build
    image: stac-higher-pipeline
    command: ["pypgstac", "migrate"]
    environment:
      - PGHOST=database
      - PGPORT=5432
      - PGUSER=username
      - PGPASSWORD=password
      - PGDATABASE=postgis
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    # PINNED (was :latest) with the auth-proxy pin below — ADR 0015: the proxy
    # write-policy factory's startup conformance check depends on this
    # version's default filter extensions; bump the pair deliberately.
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:6.3.1
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8082
      - ENVIRONMENT=local
      - PGUSER=username
      - PGPASSWORD=password
      - PGDATABASE=postgis
      - PGHOST=database
      - PGPORT=5432
      - WEB_CONCURRENCY=1
      - ENABLE_TRANSACTIONS_EXTENSIONS=TRUE
    ports:
      - "8082:8082"
    depends_on:
      database:
        condition: service_healthy
      pgstac-migrate:
        condition: service_completed_successfully
    command: >
      bash -c "
      uvicorn stac_fastapi.pgstac.app:app --host 0.0.0.0 --port 8082 --proxy-headers --forwarded-allow-ips=*
      "
    healthcheck:
      # Image ships no curl/wget; use the bundled Python against the
      # stac-fastapi liveness endpoint.
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8082/_mgmt/ping")'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # STAC API auth gateway (github.com/developmentseed/stac-auth-proxy).
  # Default mode is pass-through: DEFAULT_PUBLIC=true plus an empty
  # PRIVATE_ENDPOINTS map makes every route (reads AND transactions) reachable
  # without a token, so existing dev/e2e flows need no login. Phase 1
  # enforcement is opt-in via a compose override that restores transaction
  # protection and audience validation (reads stay public):
  #   docker compose -f docker-compose.yml -f infra/compose.auth-enforced.yml up -d --wait
  # See docs/decisions/0002-auth-proxy-enforcement.md.
  auth-proxy:
    # PINNED (was :latest) — ADR 0015: the enforced overlay's write-policy
    # factory builds against this version's internal filter-context shape
    # (and the derived image infra/proxy-policy/Dockerfile FROMs the same
    # tag); upstream bumps must be deliberate, updated in both places, and
    # re-proven by the P7-Z live confirm.
    image: ghcr.io/developmentseed/stac-auth-proxy:v1.2.0
    environment:
      - UPSTREAM_URL=http://api:8082
      # Public discovery URL (issuer as browser clients see it) vs. the
      # in-network URL the proxy uses to actually fetch metadata/JWKS.
      - OIDC_DISCOVERY_URL=http://localhost:8180/realms/stac-higher/.well-known/openid-configuration
      - OIDC_DISCOVERY_INTERNAL_URL=http://keycloak:8080/realms/stac-higher/.well-known/openid-configuration
      - DEFAULT_PUBLIC=true
      - PRIVATE_ENDPOINTS={}
    ports:
      # The container listens on 8000 (fixed by the image); host port is 8081.
      - "8081:8000"
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Exposes /health/* on the management interface (container port 9000,
      # not published to the host — no clash with MinIO's host :9000).
      - KC_HEALTH_ENABLED=true
    ports:
      # Host 8180 (container 8080): 8080 is chronically contested on dev
      # machines (editors, other stacks); Keycloak stays 8080 in-network.
      - "8180:8080"
    volumes:
      # Persist the dev-mode data dir (H2 database) so realm state survives
      # restarts. --import-realm skips realms that already exist. Mounted at
      # /opt/keycloak/data (exists in the image, owned by uid 1000) rather
      # than .../data/h2 (doesn't exist → volume would be created root-owned
      # and Keycloak couldn't write its H2 files).
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # No curl/wget in the image; use bash's /dev/tcp against the management
      # port's readiness endpoint.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  minio:
    # PGSTY Silo, a maintained MinIO fork (#47). MinIO's own images are gone
    # from Docker Hub (#25) and from quay.io (401 on every tag since
    # 2026-09-24); upstream was archived 2026-04-25. Silo keeps the MINIO_*
    # env, `server /data`, /minio/health/* and ships `mc` (a symlink to its
    # `mcli`), so nothing else here changes. Which store to keep: #48.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # `local` is the alias mc auto-resolves inside the server container.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      # Reachable from process runs (M5-G): a run writes its outputs into
      # staging/runs/{run_id}/, so object storage is the ONE platform service
      # it must reach. Attaching minio to the restricted run network — rather
      # than putting runs on the default network — keeps everything else (the
      # database, the catalog API, the socket proxy that launches runs)
      # unreachable from user code. Listing `default` is required: a service
      # that declares `networks:` stops joining the default implicitly.
      - default
      - process-runs
      # C-2: the scanner uploads its SBOMs, findings and result here.
      - scanner-egress

  # One-shot bootstrap: creates the default bucket, then exits.
  # stac-higher-deliveries: the destination bucket the GOES e2e and
  # `pipeline.demo goes-seed --deliver` deliver into (G-7).
  minio-init:
    # The server image doubles as the client: it carries `mc` and a shell.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/stac-higher &&
        mc mb --ignore-existing local/stac-higher-deliveries
    restart: "no"

  # Data plane (ROADMAP §3). Source lives in services/pipeline (separate
  # workstream); this entry assumes services/pipeline/Dockerfile.
  # --- Process executor boundary (Phase 9 / M5-B, ADR 0013) ---------------
  # The pipeline launches process runs as SIBLING containers. It must never
  # hold /var/run/docker.sock itself: that is unrestricted control of the host
  # daemon, and the pipeline is the process that also holds the DB URL and the
  # credentials master key. This HAProxy allowlist is the auditable seam —
  # container create/start/wait/logs/remove and (C-2) the image endpoints
  # (see SEC2 below) are permitted, everything else (exec, volumes, networks,
  # swarm, the daemon socket's write API) returns 403. P9-A verified the
  # container-only configuration (CONTAINERS=1, POST=1, everything else 0);
  # C-2 added IMAGES=1 on top of it.
  #
  # RESIDUAL RISK, documented rather than hidden (ADR 0013): create/start with
  # arbitrary HostConfig can still request bind mounts and privileged flags.
  # Two things contain it — the EXECUTOR is the only client of this proxy (it
  # is not published and not on the run network), and our executor never asks
  # for a mount (the revision's code travels in the environment instead).
  #
  # C-2 (ADR 0021, spec §8.5): IMAGES=1 lets the pipeline pull, push, tag,
  # delete, load and fromSrc-import images on the daemon (see SEC2 below).
  # The executor pulls only digests that exist as an approved/flagged
  # container_images row, and it is still the proxy's only client. NETWORKS,
  # VOLUMES and EXEC stay off.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      # Least privilege: containers only, and POST so create/start/kill work.
      - CONTAINERS=1
      - POST=1
      # Everything else stays off explicitly. Listing them is deliberate —
      # an upstream default flipping to 1 must be a visible diff here, not a
      # silent widening of a security boundary.
      - EXEC=0
      - VOLUMES=0
      # SEC2: IMAGES=1 is more than pull-by-digest -- it also permits image
      # push, tag, delete, load, and the `fromSrc` URL import. The proxy has
      # no way to allow only pull; the executor's own digest check is what
      # keeps the extra surface from being exercised.
      - IMAGES=1
      - NETWORKS=0
      - SERVICES=0
      - TASKS=0
      - SECRETS=0
      - CONFIGS=0
      - NODES=0
      - SWARM=0
      - SYSTEM=0
      - INFO=0
      - PLUGINS=0
      - BUILD=0
      - COMMIT=0
      - DISTRIBUTION=0
      - AUTH=0
    volumes:
      # Read-only: the proxy needs the socket, and nothing needs to write to
      # the mount itself.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # NOT published to the host, and NOT on process-runs — reachable only from
    # the default compose network, i.e. from the pipeline.
    restart: unless-stopped

  pipeline:
    build: *pipeline-build
    image: stac-higher-pipeline
    # Above the worker's SHUTDOWN_GRACEFUL_TIMEOUT_SECONDS (25 s): a stop lets
    # in-flight jobs finish or be aborted-with-retry before Docker's SIGKILL.
    stop_grace_period: 30s
    environment:
      - DATABASE_URL=postgresql://username:password@database:5432/postgis
      - HEALTH_PORT=8083
      # M3-B: the process-wide async connection pool the repos check out of.
      # DB_POOL_MAX must exceed the worker's job concurrency plus the periodic
      # ticks that overlap it (WORKER_CONCURRENCY + 4); undersizing it does not
      # error, it makes callers wait 30 s and then raise PoolTimeout. Watch
      # `requests_waiting` in GET :8083/health.
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - DB_POOL_MAX=${DB_POOL_MAX:-16}
      # M3-C: the memory envelope — see services/pipeline/README.md "Memory envelope (M3-C)"
      - GDAL_CACHEMAX=${GDAL_CACHEMAX:-64}
      - FETCH_CHUNK_BYTES=${FETCH_CHUNK_BYTES:-8388608}
      - FETCH_TRANSFER_CONCURRENCY=${FETCH_TRANSFER_CONCURRENCY:-4}
      # M3-D: 12 job slots — 8 on the `default` queue, 4 on the `bytes` queue
      # (FETCH/ITEMIZE/deliver, the jobs that hold bytes). Memory scales with
      # WORKER_BYTES_CONCURRENCY; DB_POOL_MAX must stay >= WORKER_CONCURRENCY + 4.
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-12}
      - WORKER_BYTES_CONCURRENCY=${WORKER_BYTES_CONCURRENCY:-4}
      - FLOW_STATS_FLUSH_SECONDS=${FLOW_STATS_FLUSH_SECONDS:-2.0}
      # Same master key the app uses to seal credentials (docs/connections.md).
      # The pipeline decrypts connection credentials with it; the drain/health
      # jobs fail their tick loudly if it is unset.
      - CREDENTIALS_MASTER_KEY=${CREDENTIALS_MASTER_KEY:-}
      # Egress allowlist: hosts the SSRF guard permits even when they resolve to
      # private/compose-internal addresses. Defaults cover the throwaway test
      # servers (infra/compose.test-servers.yml) and MinIO.
      - EGRESS_ALLOW_HOSTS=${EGRESS_ALLOW_HOSTS:-minio,sftp-test,ftp-test,ftps-test}
      # Platform object storage (Phase 3): the staging TTL sweep targets the
      # compose MinIO bucket. minio is in EGRESS_ALLOW_HOSTS so the pinned-egress
      # check keeps the compose-internal hostname.
      - STAGING_S3_ENDPOINT=${STAGING_S3_ENDPOINT:-http://minio:9000}
      - STAGING_S3_ACCESS_KEY_ID=${STAGING_S3_ACCESS_KEY_ID:-minioadmin}
      - STAGING_S3_SECRET_ACCESS_KEY=${STAGING_S3_SECRET_ACCESS_KEY:-minioadmin}
      - STAGING_BUCKET=${STAGING_BUCKET:-stac-higher}
      - STAGING_TTL_SECONDS=${STAGING_TTL_SECONDS:-86400}
      # D-1: base for the `derived_from` hrefs finalize stamps on process
      # outputs. Root-relative by default (like ASSET_HREF_BASE); set an
      # absolute catalog URL to publish absolute lineage hrefs.
      - CATALOG_HREF_BASE=${CATALOG_HREF_BASE:-/}
      # M3-A: pgstac partition statistics are queued by the writer (a session
      # GUC — nothing to configure) and drained by the pipeline's one-minute
      # tick. A database with pg_cron draining sets `database` so the tick
      # only samples. See services/pipeline/README.md.
      - PGSTAC_QUEUE_DRAINER=${PGSTAC_QUEUE_DRAINER:-pipeline}
      - PGSTAC_QUEUE_STALE_SECONDS=${PGSTAC_QUEUE_STALE_SECONDS:-300}
      - PGSTAC_QUEUE_HISTORY_DAYS=${PGSTAC_QUEUE_HISTORY_DAYS:-7}
      # Process executor (M5-B, ADR 0013). DOCKER_HOST must be the socket
      # proxy: the executor's startup self-check REFUSES a unix:// host, so a
      # deployment that mounts the raw socket "just for now" fails loudly
      # instead of quietly working.
      - DOCKER_HOST=${DOCKER_HOST:-tcp://docker-socket-proxy:2375}
      - PROCESS_RUNTIME_IMAGE=${PROCESS_RUNTIME_IMAGE:-stac-higher-process-runtime:local}
      # X-queue spec §8: the image behind `runtime.runtime_image: "stactools"`
      # (the built-in extractor library — `docker buildx bake -f
      # services/process-runtime/docker-bake.hcl` builds it beside the base).
      # Set it EMPTY to declare the deployment ships no such image: a run
      # asking for the alias then dies naming this variable. (`${VAR-default}`
      # on purpose, not `${VAR:-default}`: the colon form would replace an
      # empty value with the default and make "no image here" unsayable.)
      - PROCESS_RUNTIME_IMAGE_STACTOOLS=${PROCESS_RUNTIME_IMAGE_STACTOOLS-stac-higher-process-runtime-stactools:local}
      # Runs attach to this network. The default is `none` — no network at
      # all — because a process that needs egress should be an explicit
      # deployment decision, not something it inherits. Set it to
      # `stac-higher_process-runs` (the internal network declared below) for
      # runs that must reach MinIO directly.
      # The compose network name is project-prefixed. `none` (the code-level
      # default) means no network at all, which is right for a process that
      # only transforms metadata — but a process that PUBLISHES must reach
      # object storage, so the local default is the restricted run network.
      - PROCESS_NETWORK=${PROCESS_NETWORK:-stac-higher_process-runs}
      - PROCESS_LOG_MAX_BYTES=${PROCESS_LOG_MAX_BYTES:-10485760}
      - PROCESS_STS_ROLE_ARN=${PROCESS_STS_ROLE_ARN:-arn:aws:iam::000000000000:role/stac-higher-process-run}
      # The run reaches storage on its OWN network, where the pipeline's
      # endpoint hostname may not resolve; separate knob, same default here.
      - PROCESS_RUN_S3_ENDPOINT=${PROCESS_RUN_S3_ENDPOINT:-http://minio:9000}
      # GOES spec §4: the highest `runtime.network.level` a revision may ask
      # for. `isolated` until the egress proxy exists; the pipeline refuses
      # anything higher at launch, independently of the app's write gate.
      - PROCESS_NETWORK_MAX=${PROCESS_NETWORK_MAX:-isolated}
      # K-1: where the image published the hardware-profile set the `hardware`
      # build context copied in above. Unset means the repo checkout.
      - PROCESS_HARDWARE_PROFILES_FILE=${PROCESS_HARDWARE_PROFILES_FILE:-/app/share/hardware-profiles/local.json}
      # C-1: where the image published the image policy the `imagepolicy`
      # build context copied in above. Unset means the repo checkout.
      - PROCESS_IMAGE_POLICY_FILE=${PROCESS_IMAGE_POLICY_FILE:-/app/share/image-policy/default.json}
      # C-2 (container-images spec §6, §11): the scanner image, the network it
      # runs on (egress-capable: it pulls from registries; MinIO is attached),
      # whether it refreshes the Grype DB at scan start (false for air-gap,
      # with GRYPE_DB_UPDATE_URL pointing at a mirror when it is true), and
      # how many scans run at once (each holds a worker slot, I-124).
      - IMAGE_SCANNER_IMAGE=${IMAGE_SCANNER_IMAGE:-stac-higher-image-scanner:local}
      - PROCESS_SCANNER_NETWORK=${PROCESS_SCANNER_NETWORK:-stac-higher_scanner-egress}
      - IMAGE_SCANNER_DB_UPDATE=${IMAGE_SCANNER_DB_UPDATE:-true}
      - GRYPE_DB_UPDATE_URL=${GRYPE_DB_UPDATE_URL:-}
      - IMAGE_SCAN_CONCURRENCY=${IMAGE_SCAN_CONCURRENCY:-1}
      # Optional deployment Docker Hub credential for docker.io images that
      # carry no group credential (spec §5). Unset = anonymous, which shares
      # Docker's 100-pulls-per-6-hours-per-IP budget (ISSUES I-125).
      - REGISTRY_DOCKERHUB_USER=${REGISTRY_DOCKERHUB_USER:-}
      - REGISTRY_DOCKERHUB_TOKEN=${REGISTRY_DOCKERHUB_TOKEN:-}
      # GOES spec §3.4: remote input files staged concurrently per run.
      - PROCESS_INPUT_STAGE_CONCURRENCY=${PROCESS_INPUT_STAGE_CONCURRENCY:-4}
    ports:
      - "8083:8083"
    depends_on:
      database:
        condition: service_healthy
      pgstac-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8083/health")'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # --- OGC serving (pre-M5 hardening; docs/serving.md) --------------------
  # LINK-LEVEL exposure only: nothing gates requests to these services until
  # per-collection read visibility (I-1) lands — the Settings-tab toggle only
  # controls whether the collection page advertises them. Version pins follow
  # eoAPI's tested combination for pgstac 0.9.x.

  # OGC API Tiles for rasters, straight off pgstac. Reads item asset hrefs
  # from the catalog — platform `/api/assets/...` hrefs are app-relative and
  # not resolvable here; reference-mode items with absolute URLs (or s3://
  # via the AWS_* env below, pointed at MinIO) tile directly.
  titiler:
    # rasterio/psycopg wheels are not published for arm64 (eoAPI does the same)
    platform: linux/amd64
    # Derived image: upstream 1.7.2 + the /api/assets -> s3:// href mapper
    # (infra/titiler, GOES spec §7.1). Context is the repo root.
    build:
      context: .
      dockerfile: infra/titiler/Dockerfile
    image: stac-higher-titiler:local
    command: uvicorn stac_higher_titiler.main:app --host 0.0.0.0 --port 8084
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASS=password
      - POSTGRES_DBNAME=postgis
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - DB_MIN_CONN_SIZE=1
      - DB_MAX_CONN_SIZE=4
      # GDAL http/S3 tuning (eoAPI defaults), pointed at the compose MinIO so
      # s3://stac-higher/... hrefs resolve.
      - CPL_TMPDIR=/tmp
      - GDAL_CACHEMAX=25%
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - VSI_CACHE=TRUE
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_S3_ENDPOINT=minio:9000
      - AWS_HTTPS=NO
      - AWS_VIRTUAL_HOSTING=FALSE
      # Platform href mapping: mirror the pipeline's STAGING_BUCKET /
      # ASSET_HREF_BASE so the tiler resolves the same objects the app serves.
      - PLATFORM_ASSET_BUCKET=${STAGING_BUCKET:-stac-higher}
      - ASSET_HREF_BASE=${ASSET_HREF_BASE:-/api/assets}
    ports:
      - "8084:8084"
    depends_on:
      database:
        condition: service_healthy
      pgstac-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8084/healthz")'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # OGC API Features + Tiles for vector TABLES in the shared PostGIS database
  # (tipg serves database tables/functions, not STAC collections — the
  # per-collection Settings toggle links it as the stack-wide vector surface).
  tipg:
    image: ghcr.io/developmentseed/tipg:1.0.1
    command: uvicorn tipg.main:app --host 0.0.0.0 --port 8085
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASS=password
      - POSTGRES_DBNAME=postgis
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - DB_MIN_CONN_SIZE=1
      - DB_MAX_CONN_SIZE=4
    ports:
      - "8085:8085"
    depends_on:
      database:
        condition: service_healthy
      pgstac-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8085/healthz")'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  # Dedicated network for process-run containers (ADR 0013: the egress-policy
  # analog at the executor's network boundary). `internal: true` means no
  # route off the docker host — a run on this network can reach the compose
  # services attached to it and nothing on the internet.
  #
  # MinIO is attached to it (see that service) because a run must reach object
  # storage to publish its outputs — that is the whole output path. Nothing
  # else is: not the database, not the catalog API, and emphatically not the
  # socket proxy, since a run must never reach the thing that launches runs.
  #
  # M5-G finding: the first cut left this network empty AND defaulted
  # PROCESS_NETWORK to `none`, so every publishing run died with
  # EndpointConnectionError against minio:9000. Isolation that makes the
  # feature impossible is not isolation, it is a bug.
  process-runs:
    internal: true

  # C-2 (container-images spec §11): the image scanner's network. NOT
  # internal -- the scanner must reach public and private registries. Docker
  # cannot filter it by host, so `allowed_registries` is enforced twice in
  # software (the app on add, the pipeline and the scanner before any pull)
  # and the scanner is the only container on it besides MinIO (ISSUES
  # I-123). Neither the database nor the socket proxy is attached.
  #
  # SEC1: this is NOT an internal network, and being non-internal, and being
  # a plain Docker bridge, means it is not egress-isolated from the host
  # either -- a container on it can reach the docker host's own network
  # stack through the bridge gateway. On a dev host that means the scanner
  # can also reach every port this compose file publishes: Postgres 5433,
  # the auth proxy 8081, the API 8082, the pipeline 8083, titiler 8084,
  # tipg 8085, Keycloak 8180, and MinIO 9000/9001. The egress boundary for
  # registries is this network plus the `allowed_registries` allow-list in
  # the image policy file (infra/image-policy/default.json, or the
  # PROCESS_IMAGE_POLICY_FILE override) -- not network isolation, which this
  # network does not provide.
  scanner-egress:
    driver: bridge

volumes:
  pgdata:
  keycloak-data:
  minio-data:
