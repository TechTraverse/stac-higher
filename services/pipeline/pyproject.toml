[project]
name = "stac-higher-pipeline"
version = "0.1.0"
description = "STAC Higher data-plane pipeline service: ingest, delivery, retention, monitoring workers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "procrastinate>=3.0,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cryptography>=49.0.0",
    "asyncssh>=2.24.0",
    "aioftp>=0.27.2",
    "boto3>=1.43.49",
    "rio-stac==0.12.0",
    "pystac==1.15.1",
    "rasterio>=1.5,<2",
    "stac-pydantic==3.6.0",
    "pypgstac[psycopg]==0.9.11",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "defusedxml>=0.7.1",
    "cql2>=0.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# The built-in extractor library's packages (X queue spec §6/§10): the SAME
# pins as services/process-runtime/Dockerfile.stactools, so the adapter tests
# in tests/test_stactools_adapters.py run against what the image installs.
# setuptools<81 because eight of the eleven still import pkg_resources.
stactools = [
    "setuptools<81",
    "stactools==0.5.3",
    "stactools-goes==0.1.8",
    "stactools-goes-glm==0.2.4",
    "stactools-noaa-hrrr==1.0.1",
    "stactools-noaa-mrms-qpe==0.3.1",
    "stactools-noaa-cdr==0.2.1",
    "stactools-viirs==0.1.0",
    "stactools-modis==0.2.0",
    "stactools-landsat==0.5.0",
    "stactools-sentinel1==0.8.1",
    "stactools-sentinel2==0.8.0",
    "stactools-naip==0.5.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
]

[project.scripts]
pipeline = "pipeline.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# stac_higher_stactools ships in the runtime image, not this package; its
# unit tests (merge rules, adapters) run here with the `stactools` extra.
# stac_higher_scanner ships in the image-scanner image (C-2); same arrangement.
pythonpath = ["../process-runtime", "../image-scanner"]

[tool.uv]
no-build-package = ["rasterio"]
# Three stactools packages (goes-glm, noaa-hrrr, sentinel1) cap pystac below
# the platform's pin; all eleven work on 1.15.1 (the adapter tests prove it
# each run). Same override Dockerfile.stactools applies — docs/ISSUES.md I-109.
override-dependencies = ["pystac==1.15.1"]
