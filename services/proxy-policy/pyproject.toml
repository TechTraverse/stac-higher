[project]
name = "stac-higher-proxy-policy"
version = "0.1.0"
description = "stac-auth-proxy items-filter factory enforcing externally_writable for direct catalog writes (ADR 0015)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # The upstream stac-auth-proxy 1.2.0 wheel ships no Postgres driver; the
    # derived image (infra/proxy-policy/Dockerfile) installs this package,
    # pulling psycopg with it.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    # Test-only: validate emitted expressions with the same cql2 engine the
    # proxy's Cql2BuildFilterMiddleware / Cql2ValidateTransactionMiddleware use.
    "cql2>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stac_higher_proxy_policy"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
