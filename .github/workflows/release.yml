name: Release

on:
  push:
    tags: ["v*"]
  # Dry run of the chart package (R-9): package, never push.
  pull_request:
    paths:
      - infra/helm/**
      - scripts/package-chart.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: GitHub release + artifacts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock
      - run: npm ci
      - name: Build app SSR bundle
        run: npm run build --workspace app
      - name: Package app dist
        run: tar -czf "stac-higher-app-${GITHUB_REF_NAME}.tar.gz" -C app dist
      - name: Build pipeline wheel + sdist
        working-directory: services/pipeline
        run: uv build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # containers.yml's release-manifest job attaches release-manifest.json
        # to this same release; whichever workflow runs second uploads to it.
        run: |
          assets=("stac-higher-app-${GITHUB_REF_NAME}.tar.gz" services/pipeline/dist/*)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"

  chart:
    # Packages the chart on every run (docs/releases.md "The chart package").
    # A v* tag stamps version/appVersion from the tag; any other run stamps
    # 0.0.0-dryrun.<run number> and stops at the workflow artifact.
    name: Chart · package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Package
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v0.0.0-dryrun.{0}', github.run_number) }}
        run: scripts/package-chart.sh "$TAG" "$RUNNER_TEMP/chart"
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: ${{ runner.temp }}/chart/*.tgz
          if-no-files-found: error
          retention-days: 7

  chart-push:
    # Split from chart so only this job holds packages: write, and only on a
    # v* tag. The ref is the release manifest's chart.ref (owner lowercased,
    # .github/scripts/release-manifest.mjs) at chart.version (tag without v).
    name: Chart · push to GHCR
    needs: [chart]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - uses: actions/download-artifact@v7
        with:
          name: chart
          path: chart
      - name: Push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="chart/stac-higher-${version}.tgz"
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          [ -f "$archive" ] || { echo "::error::no $archive in the chart artifact"; exit 1; }
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          helm push "$archive" "$registry" 2>&1 | tee push.log
          # The pushed version must resolve before the release counts as done.
          helm show chart "$registry/stac-higher" --version "$version"
          digest=$(sed -n 's/^Digest: *//p' push.log)
          {
            echo "### Chart"
            echo
            echo "- Ref: \`${registry}/stac-higher\` version \`${version}\`"
            echo "- Digest: \`${digest:-not reported by helm push}\`"
          } >> "$GITHUB_STEP_SUMMARY"
