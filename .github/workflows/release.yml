name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release + artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock
      - run: npm ci
      - name: Build app SSR bundle
        run: npm run build --workspace app
      - name: Package app dist
        run: tar -czf "stac-higher-app-${GITHUB_REF_NAME}.tar.gz" -C app dist
      - name: Build pipeline wheel + sdist
        working-directory: services/pipeline
        run: uv build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            "stac-higher-app-${GITHUB_REF_NAME}.tar.gz" \
            services/pipeline/dist/*
