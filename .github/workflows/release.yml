name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release + artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock
      - run: npm ci
      - name: Build app SSR bundle
        run: npm run build --workspace app
      - name: Package app dist
        run: tar -czf "stac-higher-app-${GITHUB_REF_NAME}.tar.gz" -C app dist
      - name: Build pipeline wheel + sdist
        working-directory: services/pipeline
        run: uv build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # containers.yml's release-manifest job attaches release-manifest.json
        # to this same release; whichever workflow runs second uploads to it.
        run: |
          assets=("stac-higher-app-${GITHUB_REF_NAME}.tar.gz" services/pipeline/dist/*)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}" \
            || gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
