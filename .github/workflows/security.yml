name: Security

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          detect --source /repo --no-banner --redact
          --config /repo/.gitleaks.toml

  npm-deps:
    name: Dependencies · npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Gate on high in production deps (tightened from critical when the
      # Astro 7 upgrade cleared the known 6.x high advisories — I-57); the
      # full report stays visible below.
      - name: npm audit (prod deps, fail on high)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit full report (informational)
        if: always()
        run: npm audit || true

  python-deps:
    name: Dependencies · pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock
      - name: pip-audit against uv.lock
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

  misconfig:
    name: IaC misconfig (trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # dependency-review-action needs the dependency graph AND, on a PRIVATE repo,
  # GitHub Advanced Security. This repo is private with GHAS off, so the job
  # failed on every PR with "Dependency review is not supported on this
  # repository". Same treatment as CodeQL (see .github/workflows/codeql.yml):
  # ask the API instead of deleting the config, so it lights up by itself if
  # the repo goes public or GHAS is enabled.
  dependency-review-preflight:
    name: Dependency review available?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          advanced="$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '.security_and_analysis.advanced_security.status // "unset"')"
          echo "visibility=${visibility} advanced_security=${advanced}"
          if [ "${visibility}" = "public" ] || [ "${advanced}" = "enabled" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dependency review skipped::Needs GitHub Advanced Security on a private repo (visibility=${visibility}, advanced_security=${advanced})."
          fi

  dependency-review:
    name: Dependency review (PR)
    needs: dependency-review-preflight
    if: needs.dependency-review-preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
