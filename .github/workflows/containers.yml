name: Containers

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Image · ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: app
            dockerfile: app/Dockerfile
            context: .
            # The built-in extractor registry, bundled at build time (X-4),
            # and the deployment's hardware-profile set (K-1) — the app's
            # checkout-relative fallback resolves against the source
            # checkout, which is not reliable from the bundled `dist/`
            # chunks and is not in this image at all — and the image policy
            # (C-1).
            build-contexts: |
              fixtures=tests/contract-fixtures
              hardware=infra/hardware-profiles
              imagepolicy=infra/image-policy
          - name: pipeline
            dockerfile: services/pipeline/Dockerfile
            context: services/pipeline
            # The built-in extractor registry and the hardware-profile set
            # (K-1) reach the image through named build contexts (X-2) —
            # compose's additional_contexts — and the image policy (C-1).
            build-contexts: |
              fixtures=tests/contract-fixtures
              hardware=infra/hardware-profiles
              imagepolicy=infra/image-policy
          - name: titiler
            dockerfile: infra/titiler/Dockerfile
            context: .
            # upstream base is linux/amd64 only
            platforms: linux/amd64
          - name: cube-server
            # Tiles + EDR for registered virtual cubes (Z-7, virtual cube
            # spec §8). Its own context: it needs pyproject.toml + uv.lock.
            dockerfile: infra/cube-server/Dockerfile
            context: infra/cube-server
          - name: image-scanner
            # The platform image scanner (C-2): Syft + Grype, DB baked at
            # build. Tagged by date too so the baked DB's age is visible.
            dockerfile: services/image-scanner/Dockerfile
            context: services/image-scanner
          - name: auth-proxy
            # The derived stac-auth-proxy (ADR 0015 write policy + the
            # AUTH_BEARER_AUDIENCE_CLAIM check, spec §8). Repo-root context:
            # .dockerignore re-includes services/proxy-policy. The upstream
            # base is multi-arch, so the default platforms apply.
            dockerfile: infra/proxy-policy/Dockerfile
            context: .
    env:
      # Publish only from main and version tags; every other ref build-verifies.
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      # Attestations (provenance + SBOM) are attached to version-tag builds only.
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ matrix.image.name == 'image-scanner' }}
      - name: Build${{ env.PUSH == 'true' && ' + push' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.platforms || (env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64') }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: ${{ matrix.image.build-contexts || '' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: ${{ env.RELEASE == 'true' && 'mode=max' || '' }}
          sbom: ${{ env.RELEASE == 'true' && 'true' || '' }}
      - name: Record digest
        env:
          NAME: ${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            if [ "$PUSH" = "true" ]; then echo "::error::pushed $NAME but build-push-action returned no digest"; exit 1; fi
            DIGEST="$IMAGEID"   # unpushed build: the dry-run manifest gets the local image id
          fi
          mkdir -p digests && printf '%s\n' "$DIGEST" > "digests/$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}
          path: digests/${{ matrix.image.name }}
          if-no-files-found: error
          retention-days: 1
      - name: Trivy image scan (informational)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  runtime:
    # The two platform process-runtime images (ADR 0013): the base every
    # inline_python process runs on and the stactools variant of the built-in
    # extractor library (X-2). Built through services/process-runtime/
    # docker-bake.hcl, which chains the variant off the base TARGET — no
    # published base is needed to build the variant on a PR — and supplies the
    # `fixtures` context the registry COPY needs. The variant's build runs the
    # registry-driven import smoke (spec §6), so a stale package fails here.
    name: Image · process-runtime (+ stactools)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      # Attestations (provenance + SBOM) are attached to version-tag builds only.
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (runtime)
        id: meta-runtime
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-process-runtime
          bake-target: runtime
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Image metadata (stactools)
        id: meta-stactools
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-process-runtime-stactools
          bake-target: stactools
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build${{ env.PUSH == 'true' && ' + push' || '' }}
        id: bake
        uses: docker/bake-action@v6
        with:
          source: .
          # Bake resolves the file's paths against the working directory —
          # the repo root, as the bake file's comment says.
          files: |
            ./services/process-runtime/docker-bake.hcl
            cwd://${{ steps.meta-runtime.outputs.bake-file }}
            cwd://${{ steps.meta-stactools.outputs.bake-file }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          set: |
            *.platform=${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
            *.cache-from=type=gha,scope=process-runtime
            *.cache-to=type=gha,mode=max,scope=process-runtime
          provenance: ${{ env.RELEASE == 'true' && 'mode=max' || '' }}
          sbom: ${{ env.RELEASE == 'true' && 'true' || '' }}
      - name: Record digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          mkdir -p digests
          # target -> manifest key
          for pair in runtime:process-runtime stactools:process-runtime-stactools; do
            target="${pair%%:*}"; key="${pair##*:}"
            digest=$(jq -r --arg t "$target" '.[$t]["containerimage.digest"] // empty' <<<"$METADATA")
            if [ -z "$digest" ]; then
              if [ "$PUSH" = "true" ]; then echo "::error::pushed $key but bake returned no digest"; exit 1; fi
              # unpushed build: the dry-run manifest gets the local image id
              digest=$(jq -r --arg t "$target" '.[$t]["containerimage.config.digest"] // empty' <<<"$METADATA")
            fi
            if [ -z "$digest" ]; then echo "::error::no digest or image id for $key"; exit 1; fi
            printf '%s\n' "$digest" > "digests/$key"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: digest-process-runtime
          path: digests/
          if-no-files-found: error
          retention-days: 1
      - name: Trivy image scan (informational)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta-stactools.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release-manifest:
    # Collects every image digest into release-manifest.json (docs/releases.md).
    # Every run produces a dry-run artifact (version v0.0.0-dryrun.<run>), so
    # the wiring is proven on each PR. On a v* tag the file is attached to the
    # GitHub release.
    name: Release manifest
    needs: [build, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Generate
        env:
          VERSION: ${{ env.RELEASE == 'true' && github.ref_name || format('v0.0.0-dryrun.{0}', github.run_number) }}
        run: >
          node .github/scripts/release-manifest.mjs --version "$VERSION" --git-sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY" --digests-dir digests --out release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 7
      - name: Attach to the GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # release.yml creates the release and usually finishes first; either
        # side may create it, and the loser uploads to it.
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-manifest.json --clobber
          else
            gh release create "$TAG" --verify-tag --generate-notes release-manifest.json \
              || gh release upload "$TAG" release-manifest.json --clobber
          fi
