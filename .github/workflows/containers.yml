name: Containers

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Every other run gets a
# group of its own (the run id), so a main or v* tag run is never cancelled
# or queued behind another.
concurrency:
  group: containers-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    # The release version, checked before anything builds or pushes: the
    # v* tag on a tag push, else v0.0.0-dryrun.<run number>. One rule for the
    # chart and the manifest (docs/releases.md "The chart package"), so a tag
    # Helm would reject fails here, not after the images are out.
    name: Release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check
        id: check
        env:
          VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.0-dryrun.{0}', github.run_number) }}
        run: |
          scripts/package-chart.sh --check-tag "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Image · ${{ matrix.image.name }}
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: app
            dockerfile: app/Dockerfile
            context: .
            # The built-in extractor registry, bundled at build time (X-4),
            # and the deployment's hardware-profile set (K-1) — the app's
            # checkout-relative fallback resolves against the source
            # checkout, which is not reliable from the bundled `dist/`
            # chunks and is not in this image at all — and the image policy
            # (C-1).
            build-contexts: |
              fixtures=tests/contract-fixtures
              hardware=infra/hardware-profiles
              imagepolicy=infra/image-policy
          - name: pipeline
            dockerfile: services/pipeline/Dockerfile
            context: services/pipeline
            # The built-in extractor registry and the hardware-profile set
            # (K-1) reach the image through named build contexts (X-2) —
            # compose's additional_contexts — and the image policy (C-1).
            build-contexts: |
              fixtures=tests/contract-fixtures
              hardware=infra/hardware-profiles
              imagepolicy=infra/image-policy
          - name: titiler
            dockerfile: infra/titiler/Dockerfile
            context: .
            # upstream base is linux/amd64 only
            platforms: linux/amd64
          - name: cube-server
            # Tiles + EDR for registered virtual cubes (Z-7, virtual cube
            # spec §8). Its own context: it needs pyproject.toml + uv.lock.
            dockerfile: infra/cube-server/Dockerfile
            context: infra/cube-server
          - name: image-scanner
            # The platform image scanner (C-2): Syft + Grype, DB baked at
            # build. Tagged by date too so the baked DB's age is visible.
            dockerfile: services/image-scanner/Dockerfile
            context: services/image-scanner
          - name: auth-proxy
            # The derived stac-auth-proxy (ADR 0015 write policy + the
            # AUTH_BEARER_AUDIENCE_CLAIM check, spec §8). Repo-root context:
            # .dockerignore re-includes services/proxy-policy. The upstream
            # base is multi-arch, so the default platforms apply.
            dockerfile: infra/proxy-policy/Dockerfile
            context: .
    env:
      # Publish only from main and version tags; every other ref build-verifies.
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      # Attestations (provenance + SBOM) are attached to version-tag builds only.
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ matrix.image.name == 'image-scanner' }}
      - name: Build${{ env.PUSH == 'true' && ' + push' || '' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.platforms || (env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64') }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: ${{ matrix.image.build-contexts || '' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: ${{ env.RELEASE == 'true' && 'mode=max' || '' }}
          sbom: ${{ env.RELEASE == 'true' && 'true' || '' }}
      - name: Record digest
        env:
          NAME: ${{ matrix.image.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGEID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            if [ "$PUSH" = "true" ]; then echo "::error::pushed $NAME but build-push-action returned no digest"; exit 1; fi
            DIGEST="$IMAGEID"   # unpushed build: the dry-run manifest gets the local image id
          fi
          mkdir -p digests && printf '%s\n' "$DIGEST" > "digests/$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}
          path: digests/${{ matrix.image.name }}
          if-no-files-found: error
          retention-days: 7
      - name: Trivy image scan (informational)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  runtime:
    # The two platform process-runtime images (ADR 0013): the base every
    # inline_python process runs on and the stactools variant of the built-in
    # extractor library (X-2). Built through services/process-runtime/
    # docker-bake.hcl, which chains the variant off the base TARGET — no
    # published base is needed to build the variant on a PR — and supplies the
    # `fixtures` context the registry COPY needs. The variant's build runs the
    # registry-driven import smoke (spec §6), so a stale package fails here.
    name: Image · process-runtime (+ stactools)
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      # Attestations (provenance + SBOM) are attached to version-tag builds only.
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (runtime)
        id: meta-runtime
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-process-runtime
          bake-target: runtime
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Image metadata (stactools)
        id: meta-stactools
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-process-runtime-stactools
          bake-target: stactools
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build${{ env.PUSH == 'true' && ' + push' || '' }}
        id: bake
        uses: docker/bake-action@v6
        with:
          source: .
          # Bake resolves the file's paths against the working directory —
          # the repo root, as the bake file's comment says.
          files: |
            ./services/process-runtime/docker-bake.hcl
            cwd://${{ steps.meta-runtime.outputs.bake-file }}
            cwd://${{ steps.meta-stactools.outputs.bake-file }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          set: |
            *.platform=${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
            *.cache-from=type=gha,scope=process-runtime
            *.cache-to=type=gha,mode=max,scope=process-runtime
          provenance: ${{ env.RELEASE == 'true' && 'mode=max' || '' }}
          sbom: ${{ env.RELEASE == 'true' && 'true' || '' }}
      - name: Record digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          mkdir -p digests
          # target -> manifest key
          for pair in runtime:process-runtime stactools:process-runtime-stactools; do
            target="${pair%%:*}"; key="${pair##*:}"
            digest=$(jq -r --arg t "$target" '.[$t]["containerimage.digest"] // empty' <<<"$METADATA")
            if [ -z "$digest" ]; then
              if [ "$PUSH" = "true" ]; then echo "::error::pushed $key but bake returned no digest"; exit 1; fi
              # unpushed build: the dry-run manifest gets the local image id
              digest=$(jq -r --arg t "$target" '.[$t]["containerimage.config.digest"] // empty' <<<"$METADATA")
            fi
            if [ -z "$digest" ]; then echo "::error::no digest or image id for $key"; exit 1; fi
            printf '%s\n' "$digest" > "digests/$key"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: digest-process-runtime
          path: digests/
          if-no-files-found: error
          retention-days: 7
      - name: Trivy image scan (informational)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta-stactools.outputs.json).tags[0] }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  chart:
    # Packages the chart on every run (docs/releases.md "The chart package"),
    # stamped with the release version: the v* tag, or 0.0.0-dryrun.<run> on
    # every other run, which stops at the workflow artifact (the dry run).
    name: Chart · package
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package-chart.sh "$VERSION" "$RUNNER_TEMP/chart"
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: ${{ runner.temp }}/chart/*.tgz
          if-no-files-found: error
          retention-days: 7

  chart-push:
    # v* tags only, and only once every image is pushed and the chart has
    # packaged (spec §11: images, then chart, then manifest). chart itself
    # stays read-only, so no pull request or manual run reaches a write-scoped
    # chart job. The ref is the manifest's chart.ref (owner lowercased) at
    # chart.version (tag without v).
    name: Chart · push to GHCR
    needs: [build, runtime, chart]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - uses: actions/download-artifact@v7
        with:
          name: chart
          path: chart
      - name: Push
        id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="chart/stac-higher-${version}.tgz"
          registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          [ -f "$archive" ] || { echo "::error::no $archive in the chart artifact"; exit 1; }
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$REGISTRY_TOKEN"
          # Helm prints "Pushed: <ref>" and "Digest: <digest>" (pkg/registry/client.go).
          helm push "$archive" "$registry" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: *//p' push.log | tr -d '[:space:]')
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::helm push reported no chart digest"; exit 1; }
          # The pushed version must resolve before the manifest names it.
          helm show chart "$registry/stac-higher" --version "$version"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Chart"
            echo
            echo "- Ref: \`${registry}/stac-higher\` version \`${version}\`"
            echo "- Digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-manifest:
    # Collects every image digest into release-manifest.json (docs/releases.md).
    # Every run produces a dry-run artifact (version v0.0.0-dryrun.<run>), so
    # the wiring is proven on each PR. On a v* tag it waits for chart-push and
    # records the chart digest, so a manifest never names a chart that was not
    # pushed; release-attach then adds the file to the GitHub release. On other
    # runs chart-push is skipped, and the chart's dry-run package must succeed.
    name: Release manifest
    needs: [version, build, runtime, chart, chart-push]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.runtime.result == 'success'
      && needs.chart.result == 'success'
      && (needs.chart-push.result == 'success'
          || (needs.chart-push.result == 'skipped'
              && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Generate
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          CHART_DIGEST: ${{ needs.chart-push.outputs.digest }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --git-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
                --digests-dir digests --out release-manifest.json)
          if [ "$RELEASE" = "true" ]; then
            # A release manifest always carries the pushed chart's digest.
            [ -n "$CHART_DIGEST" ] || { echo "::error::chart-push reported no digest"; exit 1; }
            args+=(--chart-digest "$CHART_DIGEST")
          fi
          node .github/scripts/release-manifest.mjs "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 7

  release-attach:
    # Split from release-manifest so only this job holds contents: write.
    name: Attach release manifest
    needs: [release-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-manifest
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # release.yml creates the release and usually finishes first; either
        # side may create it, and the loser uploads to it.
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-manifest.json -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes release-manifest.json \
              || gh release upload "$TAG" release-manifest.json -R "$GITHUB_REPOSITORY" --clobber
          fi
